//For Release version
repositories {
    mavenLocal()
    google()
    mavenCentral()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-native:+'
    implementation 'com.getphyllo:phyllo-connect:0.4.0-LOCAL-TEST'
}
